<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#173c35">
  <title>Scanner QR - MAKTABA AL WILDAN 2</title>
  <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
  <style>
    *{box-sizing:border-box}body{margin:0;background:#f3f7f4;color:#173c35;font:16px Arial,sans-serif}
    main{max-width:560px;margin:24px auto;padding:18px}
    .card{background:white;border:1px solid #dfe9e2;border-radius:18px;padding:22px;box-shadow:0 8px 30px #173c3510}
    h1{font-size:22px;margin:0 0 8px}.muted{color:#667970;line-height:1.55}
    #reader{width:100%;max-width:480px;margin:18px auto}
    button{border:0;border-radius:10px;padding:13px 18px;background:#173c35;color:white;font-weight:bold;cursor:pointer;margin:4px}
    button.secondary{background:#eaf2ed;color:#173c35}
    #status{padding:12px;background:#f3f7f4;border-radius:10px;min-height:44px;line-height:1.4}
    .actions{text-align:center;margin-top:12px}
  </style>
</head>
<body>
<main>
  <section class="card">
    <h1>📷 Scanner QR Anggota</h1>
    <p class="muted">Izinkan akses kamera Chrome saat diminta. Arahkan kamera ke QR pada kartu anggota MAKTABA AL WILDAN 2.</p>
    <div id="reader"></div>
    <div id="status" role="status">Memuat scanner…</div>
    <div class="actions">
      <button id="start">Mulai Kamera</button>
      <button class="secondary" id="stop">Hentikan</button>
      <button class="secondary" id="back">Kembali ke Aplikasi</button>
    </div>
    <p class="muted" style="font-size:13px">Setelah QR terbaca, tab ini akan mengirim ID anggota ke aplikasi perpustakaan yang membukanya.</p>
  </section>
</main>
<script>
'use strict';
let scanner=null, active=false, sent=false;
const statusEl=document.getElementById('status');
function say(s){statusEl.textContent=s;}
function sendToApp(decodedText){
  if(sent)return;
  sent=true;
  const text=String(decodedText||'').trim();
  if(!text){sent=false;return;}
  say('QR terbaca: '+text+'. Mengirim hasil ke aplikasi…');
  if(window.opener && !window.opener.closed){
    window.opener.postMessage({type:'MAKTABA_QR_SCAN',text},'*');
    setTimeout(()=>window.close(),700);
  }else{
    say('QR terbaca: '+text+'. Tab aplikasi asal tidak ditemukan. Tutup tab ini dan buka scanner dari aplikasi perpustakaan.');
    sent=false;
  }
}
async function start(){
  if(!window.isSecureContext){say('Halaman tidak aman. Pastikan URL GitHub Pages menggunakan HTTPS.');return;}
  if(!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia){say('API kamera tidak tersedia. Buka halaman ini langsung di Chrome melalui HTTPS.');return;}
  if(!window.Html5Qrcode){say('Library scanner gagal dimuat. Periksa koneksi internet lalu muat ulang.');return;}
  try{
    say('Meminta izin kamera…');
    const permission=await navigator.mediaDevices.getUserMedia({audio:false,video:true});
    permission.getTracks().forEach(t=>t.stop());
    const cameras=await Html5Qrcode.getCameras();
    if(!cameras.length)throw new Error('Tidak ada kamera yang terdeteksi.');
    if(!scanner)scanner=new Html5Qrcode('reader',{verbose:false});
    const preferred=cameras.find(c=>/back|rear|environment|belakang/i.test(c.label))||cameras[0];
    const config={fps:10,qrbox:(w,h)=>{const side=Math.max(180,Math.min(300,Math.floor(Math.min(w,h)*.75)));return {width:side,height:side};},aspectRatio:1};
    try{await scanner.start(preferred.id,config,sendToApp,()=>{});}
    catch(e){await scanner.start({facingMode:'environment'},config,sendToApp,()=>{});}
    active=true;say('Kamera aktif. Arahkan QR ke dalam kotak pemindaian.');
  }catch(e){
    console.error(e);
    const n=e&&e.name||'',m=e&&e.message||String(e);
    if(n==='NotAllowedError'||n==='PermissionDeniedError')say('Izin kamera ditolak. Klik ikon gembok di address bar Chrome → Site settings → Camera → Allow, lalu muat ulang.');
    else if(n==='NotFoundError'||m.includes('Tidak ada kamera'))say('Kamera tidak ditemukan. Pastikan webcam terpasang dan terdeteksi Windows.');
    else if(n==='NotReadableError'||n==='TrackStartError')say('Kamera sedang digunakan aplikasi lain. Tutup Zoom/Meet/Teams/OBS lalu coba lagi.');
    else say('Kamera gagal dibuka: '+n+' '+m);
  }
}
async function stop(){
  if(scanner&&active){try{await scanner.stop();}catch(e){console.warn(e);}}
  active=false;say('Pemindaian dihentikan.');
}
document.getElementById('start').addEventListener('click',start);
document.getElementById('stop').addEventListener('click',stop);
document.getElementById('back').addEventListener('click',()=>window.close());
window.addEventListener('beforeunload',()=>{if(window.opener&&!window.opener.closed)window.opener.postMessage({type:'MAKTABA_QR_SCANNER_CLOSED'},'*');});
if(!window.opener)say('Peringatan: buka halaman ini melalui tombol Buka Scanner Kamera di aplikasi perpustakaan agar hasil scan dapat dikirim otomatis.');
else say('Siap. Klik Mulai Kamera.');
</script>
</body>
</html>
